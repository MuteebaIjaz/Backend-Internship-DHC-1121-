<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - ProductDetail</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">ShopHub</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products">Products</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
        </div>
        <ul class="mobile-menu" id="mobileMenu">
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
        </ul>
    </nav>


   
   
<section class="product-detail">
    <div class="breadcrumb">
        <a href="/products">Products</a> &gt; <span>Headphones</span>
    </div>

    <div class="detail-container">
        <div class="detail-image-box">
            <img src="../Images/Headphones.webp" alt="Headphones" class="detail-image">
        </div>

        <div class="detail-info">
            <span class="category-badge">Electronics</span>
            <h1>Headphones</h1>
            <p class="detail-price">500$</p>
            <p class="detail-desc">Best Wireless Headphones for gaming.</p>

          

            <div class="detail-actions">
                <a href="#" class="btn">Add to Cart</a>
                <a href="/products" class="btn btn-outline">Back to Products</a>
            </div>
        </div>
    </div>
</section>


    <footer class="footer">
        <p>&copy; 2026 ShopHub. All rights reserved.</p>
    </footer>

    <script src="/js/script.js"></script>

</body>
</html>
